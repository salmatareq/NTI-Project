<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Swaply</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="hero">

        <div class="container">

            <div class="row align-items-center">

                <div class="col-lg-6 hero-text">

                    <span class="small-title">
                        Learn • Teach • Grow
                    </span>

                    <h1>
                        Exchange Skills.
                        <br>
                        <span>Learn Something New.</span>
                    </h1>

                    <p>
                        Swaply helps you connect with people who want
                        to learn what you know, while you learn what
                        you've always wanted.
                    </p>

                    <div class="buttons">

                        <button class="btn main-btn">
                            Find Your Match
                            <i class="bi bi-arrow-right"></i>
                        </button>

                        <button class="btn second-btn">
                            Explore Skills
                        </button>

                    </div>

                    <div class="statistics">

                        <div class="stat">

                            <i class="bi bi-people-fill"></i>

                            <div>
                                <strong>10K+</strong>
                                <small>Active Learners</small>
                            </div>

                        </div>


                        <div class="stat">

                            <i class="bi bi-arrow-left-right"></i>

                            <div>
                                <strong>5K+</strong>
                                <small>Successful Swaps</small>
                            </div>

                        </div>


                        <div class="stat">

                            <i class="bi bi-star"></i>

                            <div>
                                <strong>4.8/5</strong>
                                <small>Community Rating</small>
                            </div>

                        </div>

                    </div>

                </div>


                <!-- RIGHT SIDE -->

                <div class="col-lg-6 hero-image">

                    <div class="design-area">

                        <div class="circle circle-one"></div>
                        <div class="circle circle-two"></div>

                        <div class="speech speech-left">
                            I can teach
                            <strong>English</strong>
                        </div>

                        <div class="person-card person-one">

                            <div class="person">
                                👩🏻
                            </div>

                        </div>

                        <div class="speech speech-right">
                            I can teach
                            <strong>Java</strong>
                        </div>

                        <div class="person-card person-two">

                            <div class="person">
                                👨🏻
                            </div>

                        </div>

                        <div class="swap-icon">
                            S
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


</body>

</html>
