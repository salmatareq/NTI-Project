<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../CSS/profile.css" rel="stylesheet" />
    <title>Profile</title>
  </head>
  <body>
    <main>
      <div class="container-fluid">
        <div class="row align-items-start px-3 py-3">
          <div class="col-lg-2 left-section">
            <aside class="sidebar">
              <nav class="sidebar-menu">
                <a href="#" class="sidebar-item active">
                  <span>Profile</span>
                </a>

                <a href="#" class="sidebar-item">
                  <span>My Skills</span>
                </a>

                <a href="#" class="sidebar-item">
                  <span>Requests</span>
                  <span class="menu-badge">5</span>
                </a>

                <a href="#" class="sidebar-item">
                  <span>Activity</span>
                </a>

                <a href="#" class="sidebar-item">
                  <span>Messages</span>
                  <span class="menu-badge">3</span>
                </a>

                <a href="connect.html" class="sidebar-item">
                  <span>Connections</span>
                </a>

                <a href="#" class="sidebar-item">
                  <span>Settings</span>
                </a>
              </nav>
            </aside>
          </div>
          
          <div class="col-lg-7">center</div>

          <div class="col-lg-3">
            <div class="profile-card mb-4">
              <div class="card-title">
               
                  <span>Profile visibility</span>
                 

                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" checked />
                </div>
              </div>

              <p class="card-description">
                Your profile is visible to the Swaply community
              </p>

              <div class="d-flex gap-2">
                <button class="btn-outline flex-fill">Manage Skills</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
